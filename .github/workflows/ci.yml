name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.info.outputs.version }}
      release: ${{ steps.info.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      # Cargo.toml is the only place that holds the version. A version without
      # a v<version> tag is released from main (docs/release.md).
      - run: node scripts/version.mjs check
      - id: info
        shell: bash # with pipefail
        run: node scripts/version.mjs release-info | tee -a "$GITHUB_OUTPUT"

  ui:
    name: UI (check & test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI (embedded into the daemon)
        run: npm ci && npm run build
        working-directory: ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Start aw-server (rust and python) for integration tests
        run: |
          curl -sSL -o aw.zip https://github.com/ActivityWatch/activitywatch/releases/download/v0.13.2/activitywatch-v0.13.2-linux-x86_64.zip
          unzip -q aw.zip
          ./activitywatch/aw-server-rust/aw-server-rust --testing --port 5701 --dbpath "$RUNNER_TEMP/aw-rust.db" &
          ./activitywatch/aw-server/aw-server --testing --port 5702 &
          for i in $(seq 1 60); do
            curl -sf localhost:5701/api/0/info >/dev/null && curl -sf localhost:5702/api/0/info >/dev/null && break
            sleep 1
          done
      - name: Tests
        run: cargo test --workspace
        env:
          AW_TEST_SERVERS: http://localhost:5701,http://localhost:5702

  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-build
      - run: nix build .#default -L

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [version, ui, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - name: macos
            os: macos-14
            target: universal-apple-darwin
            bundles: app,dmg
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - name: Build the CLI sidecar
        run: node scripts/prepare-sidecar.mjs --target ${{ matrix.target }}
      - name: Build the bundles
        working-directory: crates/daemon
        shell: bash
        # Signing (optional): set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
        # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID as
        # repository secrets for a signed and notarized dmg. Windows code
        # signing is configured with bundle.windows.signCommand.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Unset secrets that aren't configured: Tauri would try to sign with empty values.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          args=(--config tauri.release.conf.json --bundles ${{ matrix.bundles }})
          if [ "${{ matrix.name }}" = "macos" ]; then args+=(--target universal-apple-darwin); fi
          ../../ui/node_modules/.bin/tauri build "${args[@]}"
      - name: Check the bundle versions
        run: node scripts/version.mjs assets target/release/bundle target/universal-apple-darwin/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: aw-manual-${{ matrix.name }}
          path: |
            target/release/bundle/deb/*.deb
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: GitHub release (v${{ needs.version.outputs.version }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.version.outputs.release == 'true'
    needs: [version, bundle, nix]
    runs-on: ubuntu-24.04
    concurrency: release
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Check the release version
        run: |
          node scripts/version.mjs check
          node scripts/version.mjs assets artifacts
      - name: Create the tag
        run: |
          # Idempotent, so a failed run can be re-run; never moves an existing tag.
          # The last line is the commit (peeled, for an annotated tag).
          remote=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)
          if [ "$remote" = "$GITHUB_SHA" ]; then
            echo "$TAG already points to $GITHUB_SHA"
          elif [ -n "$remote" ]; then
            echo "::error::$TAG already exists on $remote"; exit 1
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/**/*
          draft: true
